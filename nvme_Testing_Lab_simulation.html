<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NVMe 2.0d Boot Partition Lab</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes flow-v {
            0% { top: -20px; opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
        @keyframes flow-h {
            0% { left: -20px; opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { left: 100%; opacity: 0; }
        }
        .animate-flow-v { animation: flow-v 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
        .animate-flow-h { animation: flow-h 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
        body { background-color: #020617; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        
        // Inline SVG Icons to replace Lucide library and prevent DOM mismatch errors
        const Icon = ({ name, size = 24, className = "" }) => {
            const icons = {
                'activity': <path d="M22 12h-4l-3 9L9 3l-3 9H2" />,
                'refresh-cw': <><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" /><path d="M21 3v5h-5" /><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" /><path d="M8 16H3v5" /></>,
                'play': <polygon points="5 3 19 12 5 21 5 3" />,
                'terminal': <><polyline points="4 17 10 11 4 5" /><line x1="12" y1="19" x2="20" y2="19" /></>,
                'cpu': <><rect x="4" y="4" width="16" height="16" rx="2" /><rect x="9" y="9" width="6" height="6" /><line x1="9" y1="1" x2="9" y2="4" /><line x1="15" y1="1" x2="15" y2="4" /><line x1="9" y1="20" x2="9" y2="23" /><line x1="15" y1="20" x2="15" y2="23" /><line x1="20" y1="9" x2="23" y2="9" /><line x1="20" y1="15" x2="23" y2="15" /><line x1="1" y1="9" x2="4" y2="9" /><line x1="1" y1="15" x2="4" y2="15" /></>,
                'database': <><ellipse cx="12" cy="5" rx="9" ry="3" /><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3" /><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5" /></>,
                'download': <><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v4" /><polyline points="7 10 12 15 17 10" /><line x1="12" y1="15" x2="12" y2="3" /></>,
                'shield': <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />,
                'hard-drive': <><line x1="22" y1="12" x2="2" y2="12" /><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z" /><line x1="6" y1="16" x2="6.01" y2="16" /><line x1="10" y1="16" x2="10.01" y2="16" /></>,
                'layers': <><polygon points="12 2 2 7 12 12 22 7 12 2" /><polyline points="2 17 12 22 22 17" /><polyline points="2 12 12 17 22 12" /></>,
                'check-circle-2': <><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z" /><path d="m9 12 2 2 4-4" /></>,
                'info': <><circle cx="12" cy="12" r="10" /><line x1="12" y1="16" x2="12" y2="12" /><line x1="12" y1="8" x2="12.01" y2="8" /></>
            };

            return (
                <svg 
                    xmlns="http://www.w3.org/2000/svg" 
                    width={size} 
                    height={size} 
                    viewBox="0 0 24 24" 
                    fill="none" 
                    stroke="currentColor" 
                    strokeWidth="2" 
                    strokeLinecap="round" 
                    strokeLinejoin="round" 
                    className={className}
                >
                    {icons[name] || null}
                </svg>
            );
        };

        const App = () => {
            const [step, setStep] = useState(0); 
            const [isPlaying, setIsPlaying] = useState(false);
            const [abpid, setAbpid] = useState(0);
            const [logs, setLogs] = useState(["[SYSTEM] Ready for compliance testing..."]);
            const [brs, setBrs] = useState('00b');

            const steps = [
                { label: "Idle", desc: "System Ready" },
                { label: "FW Download", desc: "Host -> Controller Buffer" },
                { label: "Commit (Act 6)", desc: "Buffer -> BP1 (Inactive)" },
                { label: "Commit (Act 7)", desc: "Toggle ABPID (0 -> 1)" },
                { label: "Verified", desc: "Update Complete" }
            ];

            const addLog = (msg) => {
                setLogs(prev => [...prev.slice(-8), `[${new Date().toLocaleTimeString()}] ${msg}`]);
            };

            const runTest = async () => {
                if (isPlaying) return;
                setIsPlaying(true);
                setStep(1);
                setBrs('01b');
                addLog("CMD: nvme fw-download /dev/nvme0 --fw=boot_v2.bin");
                await new Promise(r => setTimeout(r, 2500));
                setStep(2);
                addLog("CMD: nvme fw-commit /dev/nvme0 --slot=1 --action=6");
                await new Promise(r => setTimeout(r, 2500));
                setStep(3);
                addLog("CMD: nvme fw-commit /dev/nvme0 --slot=1 --action=7");
                await new Promise(r => setTimeout(r, 2000));
                setAbpid(1);
                setStep(4);
                setBrs('10b');
                addLog("LOG: BPINFO.ABPID updated to 1. Test PASSED.");
                setIsPlaying(false);
            };

            const reset = () => {
                setStep(0);
                setAbpid(0);
                setBrs('00b');
                setIsPlaying(false);
                setLogs(["[SYSTEM] Environment Reset. Ready."]);
            };

            return (
                <div className="min-h-screen text-slate-200 font-sans p-4 md:p-8">
                    <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4 border-b border-slate-800 pb-6">
                        <div>
                            <h1 className="text-2xl font-black tracking-tighter text-white flex items-center gap-3">
                                <Icon name="activity" className="text-blue-500 animate-pulse" />
                                NVMe 2.0d BOOT PARTITION COMPLIANCE LAB
                            </h1>
                            <p className="text-slate-500 text-sm font-medium">Validation of TP 4170 Redundant Update Lifecycle</p>
                        </div>
                        <div className="flex gap-3">
                            <button onClick={reset} className="px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-xs font-bold transition-all border border-slate-700">RESET</button>
                            <button onClick={runTest} disabled={isPlaying} className={`px-6 py-2 rounded-lg text-xs font-bold flex items-center gap-2 transition-all shadow-lg ${isPlaying ? 'bg-slate-800 text-slate-500' : 'bg-blue-600 text-white hover:bg-blue-500 shadow-blue-900/20'}`}>
                                {isPlaying ? <Icon name="refresh-cw" size={16} className="animate-spin" /> : <Icon name="play" size={16} />}
                                {isPlaying ? "TEST IN PROGRESS" : "START TEST SEQUENCE"}
                            </button>
                        </div>
                    </div>

                    <div className="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6">
                        <div className="lg:col-span-4 space-y-4">
                            <div className="bg-slate-900 rounded-2xl border border-slate-800 p-5 shadow-2xl relative overflow-hidden">
                                <div className="absolute top-0 right-0 p-3"><Icon name="terminal" size={20} className="text-slate-700" /></div>
                                <h2 className="text-xs font-bold text-blue-400 mb-4 uppercase tracking-widest">Host Test Machine</h2>
                                <div className="bg-black rounded-lg p-4 font-mono text-[11px] h-64 border border-slate-800 flex flex-col">
                                    <div className="flex-1 overflow-hidden space-y-1">
                                        {logs.map((log, i) => (
                                            <div key={i} className={log.includes('CMD') ? 'text-blue-400' : log.includes('LOG') ? 'text-emerald-400' : 'text-slate-500'}>{log}</div>
                                        ))}
                                        {isPlaying && <div className="w-2 h-4 bg-blue-500 animate-pulse inline-block align-middle ml-1" />}
                                    </div>
                                    <div className="mt-4 pt-2 border-t border-slate-800 text-slate-600 flex justify-between items-center">
                                        <span>Kernel: 6.x-NVMe-Compliance</span>
                                        <span className="flex items-center gap-1"><Icon name="cpu" size={12}/> x86_64</span>
                                    </div>
                                </div>
                                <div className="mt-4 p-4 bg-slate-800/50 rounded-xl border border-slate-700">
                                    <div className="flex justify-between items-center mb-2">
                                        <span className="text-[10px] font-bold text-slate-400 uppercase">Staged Image</span>
                                        <span className="text-[10px] bg-emerald-500/10 text-emerald-400 px-2 py-0.5 rounded">v2.0_READY</span>
                                    </div>
                                    <div className="flex items-center gap-3">
                                        <div className="p-2 bg-slate-700 rounded-lg text-blue-400"><Icon name="database" size={20} /></div>
                                        <div>
                                            <div className="text-xs font-bold text-white">boot_v2_signed.bin</div>
                                            <div className="text-[9px] text-slate-500">SHA256: 8a2f...991c</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="lg:col-span-1 flex flex-col items-center justify-center py-10 lg:py-0">
                            <div className="h-full w-0.5 bg-slate-800 relative hidden lg:block">
                                {step === 1 && <div className="absolute top-0 left-1/2 -translate-x-1/2 w-4 h-8 bg-blue-500/20 border border-blue-500 rounded flex items-center justify-center animate-flow-v"><Icon name="download" size={12} className="text-blue-400" /></div>}
                            </div>
                            <div className="w-full h-0.5 bg-slate-800 relative lg:hidden">
                                {step === 1 && <div className="absolute left-0 top-1/2 -translate-y-1/2 w-8 h-4 bg-blue-500/20 border border-blue-500 rounded flex items-center justify-center animate-flow-h"><Icon name="download" size={12} className="text-blue-400" /></div>}
                            </div>
                        </div>

                        <div className="lg:col-span-7 space-y-4">
                            <div className="bg-slate-900 rounded-2xl border border-slate-700 p-6 shadow-2xl">
                                <div className="flex justify-between items-center mb-6">
                                    <h2 className="text-xs font-bold text-emerald-400 uppercase tracking-widest flex items-center gap-2"><Icon name="hard-drive" size={16} /> Device Under Test (NVMe SSD)</h2>
                                    <div className="flex gap-4">
                                        <div className="text-center">
                                            <div className="text-[9px] text-slate-500 font-bold uppercase mb-1">CSTS.RDY</div>
                                            <div className="w-3 h-3 rounded-full bg-emerald-500 mx-auto shadow-[0_0_10px_rgba(16,185,129,0.5)]"></div>
                                        </div>
                                        <div className="text-center">
                                            <div className="text-[9px] text-slate-500 font-bold uppercase mb-1">CC.EN</div>
                                            <div className={`w-3 h-3 rounded-full mx-auto ${step > 0 ? 'bg-emerald-500 shadow-[0_0_10px_rgba(16,185,129,0.5)]' : 'bg-slate-700'}`}></div>
                                        </div>
                                    </div>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-12 gap-6">
                                    <div className="md:col-span-4 bg-black/40 rounded-xl p-4 border border-slate-800">
                                        <h3 className="text-[10px] font-bold text-slate-400 uppercase mb-3 flex items-center gap-1"><Icon name="shield" size={12} className="text-blue-400" /> MMIO Registers</h3>
                                        <div className="space-y-3">
                                            <div className="p-2 bg-slate-900 rounded border border-slate-800">
                                                <div className="flex justify-between text-[10px] mb-1"><span className="text-slate-500">BPINFO (40h)</span></div>
                                                <div className="flex justify-between text-[11px] font-mono"><span>ABPID</span><span className={step === 3 ? 'text-amber-400 font-bold animate-pulse' : 'text-blue-400'}>{abpid}</span></div>
                                                <div className="flex justify-between text-[11px] font-mono"><span>BRS</span><span className="text-emerald-400">{brs}</span></div>
                                            </div>
                                            <div className="p-2 bg-slate-900 rounded border border-slate-800">
                                                <div className="flex justify-between text-[10px] mb-1"><span className="text-slate-500">BPSEL (44h)</span></div>
                                                <div className="flex justify-between text-[11px] font-mono"><span>BPID</span><span className="text-white">{step === 2 || step === 3 ? '1' : '0'}</span></div>
                                            </div>
                                        </div>
                                    </div>
                                    <div className="md:col-span-8 flex flex-col gap-4">
                                        <div className="bg-blue-900/10 border border-blue-500/30 rounded-xl p-3 relative h-16 flex items-center justify-center">
                                            <div className="absolute top-1 left-2 text-[8px] font-bold text-blue-400 uppercase">Controller SRAM Buffer</div>
                                            {step === 1 ? (
                                                <div className="flex gap-1">{[...Array(8)].map((_, i) => (<div key={i} className="w-4 h-4 bg-blue-500 rounded-sm animate-pulse" style={{ animationDelay: `${i*100}ms` }} />))}</div>
                                            ) : step > 1 ? (
                                                <div className="flex gap-1 opacity-40">{[...Array(8)].map((_, i) => (<div key={i} className="w-4 h-4 bg-blue-500 rounded-sm" />))}</div>
                                            ) : (<div className="text-[10px] text-slate-600 font-mono italic">Buffer Empty</div>)}
                                        </div>
                                        <div className="grid grid-cols-2 gap-4 h-full">
                                            <div className={`relative p-4 rounded-xl border-2 flex flex-col items-center justify-center transition-all ${abpid === 0 ? 'border-blue-500 bg-blue-500/5' : 'border-slate-800 bg-slate-900/50'}`}>
                                                <div className="absolute top-1 left-2 text-[9px] font-bold text-slate-500">BP ID: 0</div>
                                                {abpid === 0 && <span className="absolute -top-2 right-2 px-2 py-0.5 bg-blue-600 text-[8px] font-bold text-white rounded">ACTIVE</span>}
                                                <Icon name="layers" size={24} className={abpid === 0 ? 'text-blue-500' : 'text-slate-700'} />
                                                <span className="text-[10px] font-bold mt-2">v1.0 IMAGE</span>
                                            </div>
                                            <div className={`relative p-4 rounded-xl border-2 flex flex-col items-center justify-center transition-all ${abpid === 1 ? 'border-blue-500 bg-blue-500/5 shadow-[0_0_20px_rgba(59,130,246,0.1)]' : 'border-slate-800 bg-slate-900/50'}`}>
                                                <div className="absolute top-1 left-2 text-[9px] font-bold text-slate-500">BP ID: 1</div>
                                                {abpid === 1 && <span className="absolute -top-2 right-2 px-2 py-0.5 bg-blue-600 text-[8px] font-bold text-white rounded">ACTIVE</span>}
                                                {step === 2 && (<div className="absolute inset-0 bg-emerald-500/20 rounded-xl flex items-center justify-center z-10"><Icon name="refresh-cw" className="text-emerald-400 animate-spin" /></div>)}
                                                <Icon name="layers" size={24} className={step >= 2 ? 'text-emerald-500' : 'text-slate-700'} />
                                                <span className={`text-[10px] font-bold mt-2 ${step >= 2 ? 'text-emerald-400' : 'text-slate-600'}`}>{step >= 2 ? "v2.0 IMAGE" : "EMPTY / OLD"}</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div className="bg-slate-900 rounded-2xl border border-slate-800 p-5 flex items-center justify-between gap-2 overflow-x-auto">
                                {steps.map((s, i) => (
                                    <div key={i} className="flex items-center gap-2 shrink-0">
                                        <div className={`flex flex-col items-center gap-1 transition-all ${step === i ? 'scale-110' : 'opacity-40'}`}>
                                            <div className={`w-8 h-8 rounded-full border-2 flex items-center justify-center font-bold text-xs ${step > i ? 'bg-emerald-500 border-emerald-500 text-slate-900' : step === i ? 'border-blue-500 text-blue-500 animate-pulse' : 'border-slate-700 text-slate-700'}`}>{step > i ? <Icon name="check-circle-2" size={16}/> : i}</div>
                                            <span className="text-[9px] font-bold uppercase tracking-tighter whitespace-nowrap">{s.label}</span>
                                        </div>
                                        {i < steps.length - 1 && <div className={`w-12 h-0.5 ${step > i ? 'bg-emerald-500' : 'bg-slate-800'}`} />}
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
